<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taskly — Back before your Sunday's over</title>
  <meta name="robots" content="noindex" />
  <meta name="description" content="Even Taskly takes a Sunday. We'll be back before yours." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0806;
      color: #e9e5df;
      /* warm amber glow behind the logo, fading to near-black */
      background-image:
        radial-gradient(58% 52% at 50% 40%, rgba(126, 88, 40, 0.30) 0%, rgba(64, 45, 22, 0.10) 42%, rgba(10, 8, 6, 0) 72%),
        radial-gradient(140% 120% at 50% 40%, #17120c 0%, #0a0806 55%, #060504 100%);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      padding: 24px;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 720px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand .logo {
      height: 40px;
      width: auto;
      display: block;
    }

    .brand .word {
      font-size: clamp(40px, 8vw, 54px);
      font-weight: 500;
      letter-spacing: -0.02em;
      color: #ffffff;
      line-height: 1;
    }

    .brand .flag {
      width: 30px;
      height: auto;
      display: block;
      margin-left: 5px;
      align-self: center;
      border-radius: 2px;
      box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.14), 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .divider {
      width: 60px;
      height: 1px;
      margin: 32px 0 30px;
      background: linear-gradient(90deg, rgba(200, 150, 80, 0) 0%, rgba(214, 165, 96, 0.85) 50%, rgba(200, 150, 80, 0) 100%);
    }

    .tagline {
      font-size: clamp(21px, 3.4vw, 30px);
      font-weight: 500;
      line-height: 1.45;
      letter-spacing: -0.01em;
      color: #cbc4ba;
      max-width: 16em;
    }

    .contact {
      margin-top: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }

    .contact .label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6a625a;
    }

    .email {
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.01em;
      color: #b7ad9f;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .email:hover { color: #d6a560; }
  </style>
</head>
