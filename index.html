<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found</title>
  <meta name="robots" content="noindex" />
  <!-- Force light rendering: some mobile browsers auto-darken pages, which would
       break the plain-white "broken link" look. -->
  <meta name="color-scheme" content="light" />

  <!-- Google tag (gtag.js) — GA4 property "Taskly Holding Page" (taskly.ca).
       Kept so hits on the root domain are still counted while the page is parked. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-G58M8WL5C0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-G58M8WL5C0');
  </script>

  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #fff;
      color: #1c1e21;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    main { max-width: 480px; }
    h1 { margin: 0 0 12px; font-size: 24px; font-weight: 600; line-height: 1.3; }
    p  { margin: 0; font-size: 15px; line-height: 1.5; color: #606770; }
    @media (max-width: 480px) { h1 { font-size: 20px; } p { font-size: 14px; } }
  </style>
</head>
<body>
  <main>
    <h1>Sorry, this page isn't available.</h1>
    <p>The link you followed may be broken, or the page may have been removed.</p>
  </main>
</body>
</html>
